<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planet Runner</title>
<style>
body{margin:0;overflow:hidden;background:#0b1020;font-family:sans-serif}
#hud{position:fixed;top:12px;left:0;right:0;text-align:center;color:#fff;font-size:20px;pointer-events:none}
</style>
</head>
<body>
<div id="hud">점수 0 · 스페이스/탭으로 점프</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
cam.position.set(0, 15, 12); cam.lookAt(0, 9, 0);
const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setSize(innerWidth, innerHeight); ren.setPixelRatio(devicePixelRatio);
document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xbbccdd, 0x222233, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(5, 15, 8); scene.add(sun);

const flat = c => new THREE.MeshStandardMaterial({ color: c, flatShading: true });
const R = 10;

// 행성: 로우폴리 구 + 정점 노이즈 + 정점별 색(바다/육지)
const pg = new THREE.IcosahedronGeometry(R, 3).toNonIndexed();
const pos = pg.attributes.position, cols = [];
for (let i = 0; i < pos.count; i += 3) {
  const land = Math.random() < 0.45;
  const c = new THREE.Color(land ? 0x4a9a3a : 0x2a5fa8);
  for (let k = 0; k < 3; k++) cols.push(c.r, c.g, c.b);
}
pg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
const planet = new THREE.Mesh(pg, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true }));
scene.add(planet);

// 도로 (행성 둘레 띠)
const road = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.05, R + 0.05, 2, 48, 1, true), flat(0xd8c49a));
road.rotation.z = Math.PI / 2; planet.add(road);

// 건물 & 장애물
const put = (obj, ang, side) => {
  const g = new THREE.Group(); g.rotation.x = ang; obj.position.set(side, R, 0); g.add(obj); planet.add(g); return obj;
};
for (let i = 0; i < 40; i++) {
  const h = 0.8 + Math.random() * 2;
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.8, h, 0.8), flat(new THREE.Color().setHSL(0.05, 0.2, 0.3 + Math.random() * 0.4)));
  b.geometry.translate(0, h / 2, 0);
  put(b, Math.random() * Math.PI * 2, (Math.random() < 0.5 ? -1 : 1) * (1.8 + Math.random() * 2));
}
const rocks = [];
for (let i = 0; i < 8; i++) {
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35), flat(0x555555));
  r.userData.ang = 0.5 + i * 0.7;
  put(r, r.userData.ang, 0); r.position.y += 0.2; rocks.push(r);
}

// 로봇 캐릭터 (박스 조합)
const bot = new THREE.Group(), grey = flat(0xbbbbbb);
const box = (w, h, d, x, y, p = bot) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), grey); m.position.set(x, y, 0); p.add(m); return m; };
box(0.6, 0.7, 0.4, 0, 1.25); box(0.5, 0.4, 0.45, 0, 1.85);
const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.06), new THREE.MeshBasicMaterial({ color: 0xffdd55 }));
lamp.position.set(0, 1.95, 0.24); bot.add(lamp);
const limb = (x, y, len) => { const p = new THREE.Group(); p.position.set(x, y, 0); const m = box(0.18, len, 0.18, 0, -len / 2, p); bot.add(p); return p; };
const legL = limb(-0.15, 0.9, 0.9), legR = limb(0.15, 0.9, 0.9), armL = limb(-0.4, 1.55, 0.6), armR = limb(0.4, 1.55, 0.6);
bot.position.y = R; bot.rotation.y = Math.PI; scene.add(bot);

// 비구름 + 비
const cloud = new THREE.Group();
for (let i = 0; i < 5; i++) {
  const c = new THREE.Mesh(new THREE.IcosahedronGeometry(0.8 + Math.random() * 0.5, 0), flat(0x667080));
  c.position.set((i - 2) * 0.9, Math.random() * 0.4, Math.random() - 0.5); cloud.add(c);
}
cloud.position.set(0, R + 5, 0); scene.add(cloud);
const N = 300, rg = new THREE.BufferGeometry(), rp = new Float32Array(N * 3);
for (let i = 0; i < N; i++) rp.set([(Math.random() - .5) * 4, R + Math.random() * 4.5, (Math.random() - .5) * 3], i * 3);
rg.setAttribute('position', new THREE.BufferAttribute(rp, 3));
scene.add(new THREE.Points(rg, new THREE.PointsMaterial({ color: 0x88aaff, size: 0.06 })));

// 입력 & 루프
let vy = 0, y = 0, score = 0, t = 0, over = false, speed = 0.5;
const hud = document.getElementById('hud');
const jump = () => { if (over) location.reload(); else if (y === 0) vy = 7; };
addEventListener('keydown', e => e.code === 'Space' && jump());
addEventListener('pointerdown', jump);
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); });

const clock = new THREE.Clock();
ren.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!over) {
    t += dt; speed += dt * 0.01; planet.rotation.x += speed * dt;
    vy -= 20 * dt; y = Math.max(0, y + vy * dt); if (y === 0) vy = 0;
    bot.position.y = R + y;
    const s = Math.sin(t * 12) * 0.8 * (y ? 0.3 : 1);
    legL.rotation.x = s; legR.rotation.x = -s; armL.rotation.x = -s; armR.rotation.x = s;
    for (const r of rocks) {
      const a = ((r.userData.ang + planet.rotation.x) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      const d = Math.min(a, Math.PI * 2 - a);
      if (d < 0.05 && y < 0.4) { over = true; hud.textContent = `게임 오버! 점수 ${score|0} · 탭하여 재시작`; }
    }
    score += dt * 10; if (!over) hud.textContent = `점수 ${score | 0}`;
  }
  for (let i = 0; i < N; i++) { let v = rp[i * 3 + 1] - dt * 8; if (v < R) v = R + 4.5; rp[i * 3 + 1] = v; }
  rg.attributes.position.needsUpdate = true;
  cloud.position.x = Math.sin(t) * 0.2;
  ren.render(scene, cam);
});
</script>
</body>
</html>
